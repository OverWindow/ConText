services:
  postgres:
    image: docs-postgres-vector:17-0.8.7
    build: ./infra/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workspace}
      POSTGRES_DB: ${POSTGRES_DB:-workspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: development
    environment: &backend-environment
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINDLOGIC_API_KEY: ${MINDLOGIC_API_KEY:-}
      MINDLOGIC_BASE_URL: ${MINDLOGIC_BASE_URL:-https://factchat-cloud.mindlogic.ai/v1/gateway}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-workspace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workspace}}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_PRESIGNED_URL_TTL: ${S3_PRESIGNED_URL_TTL:-600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ./backend
      target: development
    environment: *backend-environment
    command: ["celery", "-A", "app.processing.worker:celery", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes:
      - ./backend:/app
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  dispatcher:
    build:
      context: ./backend
      target: development
    environment: *backend-environment
    command: ["python", "-m", "app.processing.dispatcher"]
    volumes:
      - ./backend:/app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
      DESKTOP_MAC_DOWNLOAD_URL: ${DESKTOP_MAC_DOWNLOAD_URL:-}
      DESKTOP_WINDOWS_DOWNLOAD_URL: ${DESKTOP_WINDOWS_DOWNLOAD_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  frontend_node_modules:
  frontend_next:
